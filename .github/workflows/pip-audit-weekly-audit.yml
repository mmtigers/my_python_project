name: pip-audit Weekly Audit

# MY_HOME_SYSTEM/requirements.txt・requirements-dev.txt・DDD/requirements.txt を
# 対象に、既知CVEの検知結果を週次でIssueとして報告する(Issue #400 で dev/DDD を追加)。test.yml の Security Scan ジョブの pip-audit ステップはPRの差分と
# 無関係な新規CVE公開でも赤くなり得るため非ブロッキングにしている(Issue #324)。
# その代わりに、仕様書ドリフト(spec-drift-weekly-audit.yml)と同じ型の定期監査
# Issueで放置を防ぐ。

on:
  schedule:
    # 毎週月曜 09:30 JST (00:30 UTC。spec-drift-weekly-audit.yml と同時刻を避ける)
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: pip-audit full report
    runs-on: ubuntu-latest
    timeout-minutes: 20  # C-L1 (Issue #414)
    defaults:
      run:
        working-directory: MY_HOME_SYSTEM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Issue #403: 実機 .venv とCIで同じ版を使うよう MY_HOME_SYSTEM/.python-version を参照する
          python-version-file: MY_HOME_SYSTEM/.python-version
          cache: pip
          cache-dependency-path: |
            MY_HOME_SYSTEM/requirements.txt
            MY_HOME_SYSTEM/requirements-dev.txt
            DDD/requirements.txt

      - name: Install dependencies
        # Issue #400: pip-audit 自体も requirements-dev.txt と同じバージョンに固定する
        # (未固定だと監査ツール側の挙動変化で週次結果が揺れる)。
        # Issue #499: pip-auditは-r指定でrequirementsファイルを直接読むだけであり、
        # 監査対象パッケージのインストールは不要なため、requirements.txt自体は
        # インストールしない。
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.9.0

      - name: Run pip-audit (non-blocking)
        id: audit
        # Issue #366: pip-audit は検知0件のとき `-o` の出力ファイルを一切生成しない
        # (stdoutに "No known vulnerabilities found" を出して exit 0 するだけ)。
        # 「ファイル無し=チェック失敗」と誤判定して毎週誤Issueを起票しないよう、
        # exit code(0=検知なし / 1=検知あり or pip-audit自体のエラー)と
        # 「pip-auditがレポートファイルを書いたか」を $GITHUB_OUTPUT に記録し、
        # 次のステップはファイルの中身ではなくこの2値で clean/vuln/failure を判定する。
        # ファイルが無い場合はアーティファクト用に固定文言のファイルを作っておく。
        #
        # MY_HOME_SYSTEM と DDD は別々の .venv で動く独立した環境であり、同じパッケージを
        # 異なるバージョン制約で固定している(例: beautifulsoup4 は MY_HOME_SYSTEM が
        # ==4.14.3、DDD が >=4.15.0)。pip-audit に3ファイルを一度に -r 指定すると単一の
        # 仮想環境で全制約を同時に解決しようとして ResolutionImpossible で exit 1
        # (レポート未生成)になり、実際には脆弱性が無くても毎週「チェック自体が失敗」の
        # Issue が起票され続ける。実機と同じ単位(MY_HOME_SYSTEM の2ファイル / DDD の
        # 1ファイル)で個別に監査し、結果を1つのレポートに結合する。
        run: |
          overall_code=0
          report_written=false
          : > pip-audit-report.md
          run_audit() {
            # $1: 表示名  $2..: pip-audit に渡す -r 引数
            local label="$1"; shift
            local out="pip-audit-${label}.md"
            rm -f "$out"
            set +e
            pip-audit "$@" --desc -f markdown -o "$out"
            local code=$?
            set -e
            echo "pip-audit (${label}) exit code: ${code}"
            if [ -f "$out" ]; then
              report_written=true
              {
                echo "### ${label}"
                echo
                cat "$out"
                echo
              } >> pip-audit-report.md
            fi
            # 1件でも「pip-audit 自体のエラー(exit 1 かつレポート未生成、または 1 以外の
            # 非ゼロ)」があれば、脆弱性検知(exit 1 + レポート有り)より優先して failure 扱いにする。
            if [ "$code" -ne 0 ]; then
              if [ "$code" -eq 1 ] && [ -f "$out" ]; then
                if [ "$overall_code" -eq 0 ]; then overall_code=1; fi
              else
                overall_code=2
              fi
            fi
          }
          run_audit MY_HOME_SYSTEM -r requirements.txt -r requirements-dev.txt
          run_audit DDD -r ../DDD/requirements.txt
          echo "exit_code=${overall_code}" >> "$GITHUB_OUTPUT"
          echo "report_written=${report_written}" >> "$GITHUB_OUTPUT"
          if [ "$report_written" != "true" ]; then
            echo "No known vulnerabilities found" > pip-audit-report.md
          fi
          echo "overall exit code: ${overall_code}"

      - name: Create or update tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const title = "📋 pip-audit 定期監査";
            const header = "## pip-audit 定期監査（MY_HOME_SYSTEM/requirements.txt, requirements-dev.txt, DDD/requirements.txt）\n\n";
            // Issue #366: 判定はレポートファイルの有無/中身ではなく、前ステップが記録した
            // exit code と「pip-auditがレポートを書いたか」で行う(0件時はファイルが生成されないため)。
            const exitCode = "${{ steps.audit.outputs.exit_code }}";
            const reportWritten = "${{ steps.audit.outputs.report_written }}" === "true";
            let report;
            let isClean = false;
            if (exitCode === "0") {
              isClean = true;
              report = header + "検知事項なし。";
            } else if (exitCode === "1" && reportWritten) {
              // 脆弱性検知あり: pip-audit が書いた Markdown レポートをそのまま載せる
              let body = "";
              try {
                body = fs.readFileSync("MY_HOME_SYSTEM/pip-audit-report.md", "utf8").trim();
              } catch (e) {
                body = "";
              }
              report = header + (body || "脆弱性が検知されましたが、レポート本文を読み取れませんでした。Actionsのログを確認してください。");
            } else {
              // exit 1 でレポート未生成(=pip-audit自体のエラー)、またはその他の異常終了
              report = header +
                `チェック自体が失敗しました(pip-audit exit code: ${exitCode || "不明"})。` +
                "Actionsのログを確認してください（このチェックはブロッキングではありません）。";
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);
            const body = report + `\n\n---\n最終実行: ${date} ([ワークフロー実行結果](${runUrl}))`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pip-audit-audit",
            });
            const existing = issues.find((i) => i.title === title);

            if (isClean) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `検知事項なしになったため、このIssueをクローズします。\n\n${body}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: "open",
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `再監査で内容を更新しました（${date}）。`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["pip-audit-audit"],
              });
            }
