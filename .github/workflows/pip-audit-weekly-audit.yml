name: pip-audit Weekly Audit

# MY_HOME_SYSTEM/requirements.txt を対象に、既知CVEの検知結果を週次でIssueとして
# 報告する。test.yml の Security Scan ジョブの pip-audit ステップはPRの差分と
# 無関係な新規CVE公開でも赤くなり得るため非ブロッキングにしている(Issue #324)。
# その代わりに、仕様書ドリフト(spec-drift-weekly-audit.yml)と同じ型の定期監査
# Issueで放置を防ぐ。

on:
  schedule:
    # 毎週月曜 09:30 JST (00:30 UTC。spec-drift-weekly-audit.yml と同時刻を避ける)
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: pip-audit full report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MY_HOME_SYSTEM
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MY_HOME_SYSTEM/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit (non-blocking)
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc -f markdown -o pip-audit-report.md || true

      - name: Create or update tracking issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require("fs");
            const title = "📋 pip-audit 定期監査";
            let report;
            try {
              report = fs.readFileSync("MY_HOME_SYSTEM/pip-audit-report.md", "utf8").trim();
              if (!report) {
                report = "## pip-audit 定期監査（MY_HOME_SYSTEM/requirements.txt）\n\n検知事項なし。";
              } else {
                report = "## pip-audit 定期監査（MY_HOME_SYSTEM/requirements.txt）\n\n" + report;
              }
            } catch (e) {
              report = "## pip-audit 定期監査（MY_HOME_SYSTEM/requirements.txt）\n\n" +
                "チェック自体が失敗しました。Actionsのログを確認してください（このチェックはブロッキングではありません）。";
            }
            const isClean = report.includes("検知事項なし") || report.includes("No known vulnerabilities found");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);
            const body = report + `\n\n---\n最終実行: ${date} ([ワークフロー実行結果](${runUrl}))`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pip-audit-audit",
            });
            const existing = issues.find((i) => i.title === title);

            if (isClean) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `検知事項なしになったため、このIssueをクローズします。\n\n${body}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: "open",
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `再監査で内容を更新しました（${date}）。`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["pip-audit-audit"],
              });
            }
