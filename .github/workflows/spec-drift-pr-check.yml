name: Spec Drift Check (PR)

# docs/specifications/ の仕様書は、対応するソースファイルと1:1で対応する規約になっている。
# PRでソースを変更したときに対応する仕様書の更新を忘れると"ドリフト"が発生するため、
# 2026-08の仕様書一斉監査(98件中44件がドリフトしていた)を踏まえて追加した検知ワークフロー。
#
# 方針: あくまで気付きを与えるだけの非ブロッキングチェック。
# フォーマットのみの変更など、仕様書更新が不要なケースも多いためCIを赤くはしない。

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: spec-drift-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check spec/source drift
    runs-on: ubuntu-latest
    timeout-minutes: 10  # C-L1 (Issue #414)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Issue #403: 実機 .venv とCIで同じ版を使うよう MY_HOME_SYSTEM/.python-version を参照する
          python-version-file: MY_HOME_SYSTEM/.python-version

      - name: Run drift check (non-blocking)
        id: drift
        continue-on-error: true
        # Issue #407: 以前は base.sha と github.sha(マージ参照)を比較していたが、
        # マージ参照は checkout 時点の base で作られるため、イベント発行〜checkout の
        # 間に base が進むと base 側の変更が差分に混入して誤検知していた。
        # PR head と、head/base の merge-base(三点比較)で PR 自身の変更だけを見る。
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          echo "base=${base_sha} head=${head_sha} merge-base=${merge_base}"
          python3 .github/scripts/check_spec_drift.py pr \
            --base "$merge_base" \
            --head "$head_sha" \
            --out drift-report.md

      - name: Read report
        id: report
        run: |
          {
            echo 'body<<SPEC_DRIFT_EOF'
            if [ -f drift-report.md ]; then
              cat drift-report.md
            else
              echo "## 仕様書ドリフトチェック（PR差分）"
              echo ""
              echo "チェック自体が失敗しました。Actionsのログを確認してください（このチェックはブロッキングではありません）。"
            fi
            echo 'SPEC_DRIFT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        # Low: フォークからのPRではGITHUB_TOKENが強制的に読み取り専用になり、
        # このステップは403で失敗する。このワークフローは「気付きを与えるだけの
        # 非ブロッキングチェック」(冒頭コメント参照)であり、上のdrift-checkステップ
        # 同様、コメント投稿の失敗でCI全体を赤くすべきではない。
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = "<!-- spec-drift-check -->";
            const body = marker + "\n" + ${{ toJSON(steps.report.outputs.body) }};

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
