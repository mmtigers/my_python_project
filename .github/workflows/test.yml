name: Python Tests

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./MY_HOME_SYSTEM

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint (ruff)
      run: |
        # ruff.toml intentionally enables only a small, high-signal Pyflakes
        # rule set (undefined names etc.) so this catches real bugs without
        # failing on pre-existing style variance across the codebase.
        ruff check .

    - name: Run Tests
      run: |
        # CI環境用の環境変数を設定
        export SQLITE_DB_PATH=":memory:"
        export NAS_MOUNT_POINT="./tmp_nas"  # <--- これを追加！(NASの場所を一時フォルダに変更)
        export NOTIFICATION_TARGET="none"   # <--- ついでに通知も飛ばないように設定

        # テスト実行
        # 旧 `unittest discover` はpytestスタイルのテスト(@pytest.mark.asyncio等)を
        # 収集できず、実装と乖離したテストが検知されないまま放置される問題があったため、
        # unittest.TestCase / pytestスタイルの両方を収集できる pytest に統一する。
        python -m pytest tests/ -v