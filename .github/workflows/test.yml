name: Python Tests

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# M-10-1: 他2ワークフロー(spec-drift-*.yml)は最小権限を明示しているが、
# 本ワークフローには permissions ブロックが無く、リポジトリ設定次第で
# write-all トークンが供給される余地があった。読み取り専用に固定する。
permissions:
  contents: read
  # カバレッジのラチェット比較(master の直近成功 run の成果物を actions/download-artifact で取得)に必要
  actions: read

defaults:
  run:
    working-directory: ./MY_HOME_SYSTEM

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # C-L1 (Issue #414): 既定の360分ではハング時にActionsを浪費するため上限を設ける
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ruff ラチェット(merge-base との比較)のため履歴が必要
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Issue #403: 実機 .venv とCIで同じ版を使うよう MY_HOME_SYSTEM/.python-version を参照する
          python-version-file: MY_HOME_SYSTEM/.python-version
          cache: pip
          cache-dependency-path: |
            MY_HOME_SYSTEM/requirements.txt
            MY_HOME_SYSTEM/requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (correctness gate - blocking)
        # 未定義名の参照・構文エラー等、明確なバグのみをブロッキング条件とする。
        # 既存コードには多数のスタイル上の指摘(未使用import等)が残っているが、
        # それらでPRを一律ブロックしないよう、次のステップでは警告のみに留める。
        run: ruff check . --select F821,F822,F823,E9 --output-format=github

      - name: Ruff (full report - non-blocking)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Ruff DDD (correctness gate - blocking)
        # H-11: MY_HOME_SYSTEM以外(DDD)は従来CI対象外だった。
        # 同じ「明確なバグのみブロッキング」方針をDDDにも適用する。
        working-directory: ./DDD
        run: ruff check . --select F821,F822,F823,E9 --output-format=github

      - name: Ruff DDD (full report - non-blocking)
        working-directory: ./DDD
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Ruff ratchet - no new findings vs merge-base (blocking, PR only)
        # フルレポートの既存指摘(MY_HOME_SYSTEM 約90件・DDD 約15件)は、仕様書が行番号で
        # ソースを引用する規約のため一括整形で消せない(ruff.toml 冒頭参照)。
        # 代わりに merge-base 時点と比較して「増えた指摘」だけをブロックする
        # (.github/scripts/check_lint_ratchet.py)。既存指摘を減らす PR は通る。
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          python3 .github/scripts/check_lint_ratchet.py --tool ruff --dir MY_HOME_SYSTEM --base "$merge_base"
          python3 .github/scripts/check_lint_ratchet.py --tool ruff --dir DDD --base "$merge_base"

      - name: Spec drift script tests (pytest .github/scripts/)
        # Issue #402: check_spec_drift.py の回帰テストは従来「手動実行前提」でCI未実行
        # だった。tmp_path 上の疑似リポジトリで完結するようになったため、
        # lint ジョブ(依存が requirements-dev.txt だけで軽い)でブロッキング実行する。
        working-directory: .
        run: python -m pytest .github/scripts/ -q

      - name: requirements lock is in sync with requirements.in (blocking)
        # Issue #744 (AUDIT-015): CLAUDE.md は「依存の追加・変更は requirements.in /
        # requirements-dev.in を編集し pip-compile で lock を再生成する(手で編集しない。
        # Issue #647)」と規定しているのに、それを担保するゲートが1つも無かった。
        # (1) .in だけ編集して pip-compile を忘れる → 実機は古い lock で入れるため
        #     追加した依存が入らない(Issue #736 と同じ失敗モード)
        # (2) requirements.txt を手で編集する → 次の pip-compile で黙って消える
        # のどちらも CI が緑のまま通っていた。current_schema.sql / .env.example と同じ
        # 「生成物の整合検証」を lock にも適用する。
        #
        # 構造的な検査(.in の直接依存が lock に pin されているか)は
        # .github/scripts/test_requirements_lock_sync.py が既に行っている(ネットワーク不要、
        # ローカルでも実行できる)。ここでは実際に pip-compile を走らせて
        # 依存の中身(パッケージのpinと「# via」注記)に差分が無いことまで確認する。
        # pip-compile は既存の pin を維持するため、新しいリリースが出ただけで差分が
        # 生じることはない。
        #
        # ヘッダーの先頭6行(「# by the following command: / #    pip-compile ...」)は
        # 比較から除外する。ここに記録される --no-index の有無は、実行環境の pip
        # バージョンによって pip-compile 自身が変えることがあり(観測: pip 24.0 では
        # 付かず、pip 26.2.1 では付く。要求した引数は両者で同一)、依存の同期状態とは
        # 無関係にジョブを赤くする。この6行の形式は pip-tools の Writer.write_header()
        # が固定で出力するもの。
        run: |
          pip install pip-tools
          status=0
          for pair in "requirements.in:requirements.txt" "requirements-dev.in:requirements-dev.txt"; do
            src="${pair%%:*}"; lock="${pair##*:}"
            cp "$lock" "${RUNNER_TEMP}/${lock}.orig"
            pip-compile --quiet --strip-extras --no-emit-index-url --output-file "$lock" "$src"
            if ! diff -u <(tail -n +7 "${RUNNER_TEMP}/${lock}.orig") <(tail -n +7 "$lock"); then
              echo "::error file=MY_HOME_SYSTEM/${lock}::${lock} が ${src} と同期していません。pip-compile で再生成してコミットしてください。"
              status=1
            fi
            # 後続ステップが元の lock を見るよう復元する
            cp "${RUNNER_TEMP}/${lock}.orig" "$lock"
          done
          exit "$status"

      - name: Pyright (correctness gate - blocking)
        # Issue #487: 以前は services/quest_service.py:45 の到達不能な相対import
        # (削除済み)でmypyが1行目で解析を停止し、型チェッカがコードベースを
        # 一切検証できていなかった。ruff/bandit/shellcheckと同じ「まず非
        # ブロッキングで可視化してから絞る」方針でpyrightを導入する
        # (mypyより高速でvenv解決が容易なため推奨)。
        # Issue #532: MY_HOME_SYSTEM/pyrightconfig.json で typeCheckingMode を off にし、
        # 未定義名・未束縛変数・await 漏れ(reportUnusedCoroutine)等の「明確なバグ」
        # 診断だけを error にしてブロッキング化した(line-bot-sdk 等の型スタブ起因の
        # 241 件は対象外)。診断を追加する場合は同ファイルで有効化する。
        run: npx --yes pyright@1.1.390 .

      - name: ShellCheck (blocking)
        # Issue #486: Pythonにはruff、TypeScriptにはESLintがあるのに、本番の起動と
        # 全cronを担うシェルスクリプト(start_all.sh/run_task.sh等)には静的解析が
        # 無かった。ruff/banditと同じ方針(まずフルレポートを可視化し、error 0件を
        # 維持できるようになったらブロッキング化する)を適用する。shellcheckは
        # ubuntu-latestにプリインストール済みのため追加インストールは不要。
        # Issue #532: 残っていた3件(SC1090/SC2034/SC2155)を解消し、指摘 0 件を
        # 維持するためブロッキング化した。
        # deploy/git-hooks/post-merge はリポジトリ管理の git フック(拡張子なし。同
        # ディレクトリの README.md を巻き込まないよう glob ではなくファイル名で列挙する)。
        working-directory: .
        run: |
          shellcheck -x \
            MY_HOME_SYSTEM/*.sh \
            MY_HOME_SYSTEM/tools/*.sh \
            MY_HOME_SYSTEM/scripts/*.sh \
            .github/scripts/*.sh \
            family-quest/deploy.sh \
            deploy/git-hooks/post-merge

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    # C-L1 (Issue #414): pytest約1分 + DDDテスト約15秒 + インストール時間に対して十分な余裕
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Issue #403: 実機 .venv とCIで同じ版を使うよう MY_HOME_SYSTEM/.python-version を参照する
          python-version-file: MY_HOME_SYSTEM/.python-version
          cache: pip
          cache-dependency-path: |
            MY_HOME_SYSTEM/requirements.txt
            MY_HOME_SYSTEM/requirements-dev.txt
            DDD/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # Issue #367で.coveragercのomitを「本当に実行不能なもの」だけに絞った真の
        # ビューを基準に64を設定したが、Issue #494時点の実測(2026-09-06: 69.92%,
        # 7,233 stmts / miss 2,176)に対して約6ptの余裕があり退行を見逃していたため、
        # 実測より約3pt下の67へ引き上げた。Issue #536: PR #526 後の実測 73.10% に
        # 合わせて 70 へ再度引き上げた。段階的に引き上げること。
        #
        # 2026-09-21: 実測が 86%(9,971 stmts / miss 1,396 / 2,168 passed)まで伸び、
        # 床 70 との差が 16pt に開いていた。ラチェット導入で手動引き上げは不要という
        # 整理だったが、ラチェットは `pull_request` でしか走らず、比較元の成果物
        # (保持14日)が取れないときはスキップされる。その場合に効くのは床だけなので、
        # 床も実測に追従させる必要がある。実測より約4pt下の 82 へ引き上げた。
        env:
          # CI環境用の環境変数。SQLITE_DB_PATHはconfig.py側で読み込まれるよう修正済み。
          SQLITE_DB_PATH: ":memory:"
          NAS_MOUNT_POINT: "./tmp_nas"
          NOTIFICATION_TARGET: "none"
        run: |
          python -m pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=82

      - name: Find latest successful master run (coverage baseline)
        # カバレッジのラチェット比較元。master の直近成功 run(本ワークフロー)を探す。
        # 無ければ run_id が空のまま次のステップがスキップされ、固定閾値
        # (--cov-fail-under)だけがゲートになる。
        #
        # 処理の実体と、2026-09-21 に「11日前の run を比較元に選ぶ」事故が起きた経緯は
        # .github/scripts/find_coverage_baseline.sh のコメントと
        # docs/runbooks/ci_coverage_ratchet.md にある。frontend ジョブと同じ数行を
        # コピーしていたため両方が同じように壊れていたので、スクリプトへ切り出して
        # shellcheck と pytest(.github/scripts/test_find_coverage_baseline.py)の
        # 対象に入れてある。
        if: github.event_name == 'pull_request'
        id: baseline_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ../.github/scripts/find_coverage_baseline.sh

      - name: Download master coverage baseline
        # 別 run の成果物取得は run-id + github-token を指定した actions/download-artifact で行う
        # (gh run download は同じ条件で "no valid artifacts found" になることがあった)。
        # 成果物の保持期限(14日)切れ等で取れなくても失敗にはしない(比較スキップ)。
        if: github.event_name == 'pull_request' && steps.baseline_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          run-id: ${{ steps.baseline_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: MY_HOME_SYSTEM/coverage-baseline

      - name: Coverage ratchet vs master (blocking, PR only)
        # 固定閾値は床として据え置き、master の実測から 0.5pt を超えて下がったら失敗させる
        # (.github/scripts/check_coverage_ratchet.py)。これまで人手で行っていた
        # 「実測より約3pt下へ段階的に引き上げる」運用(Issue #494/#536)を不要にする。
        if: github.event_name == 'pull_request'
        run: |
          baseline="$(find coverage-baseline -name coverage.xml -print -quit 2>/dev/null || true)"
          python3 ../.github/scripts/check_coverage_ratchet.py --label backend \
            --current coverage.xml --baseline "${baseline:-coverage-baseline/missing.xml}"

      - name: Install DDD dependencies
        # lint/bandit(H-11)はDDDにも対象拡大済みだが、pytestだけCIから未実行だった。
        # DDD/conftest.py(#103/#137)がDiscord/LINE Webhook系の環境変数をマスクする
        # ため、logger.error/critical経由で本番Webhookへ誤通知する心配はない。
        working-directory: ./DDD
        run: pip install -r requirements.txt

      - name: Run DDD tests with coverage
        # Issue #493: DDDは全体の約3分半かかるという前提でPR差分ベースの条件付き
        # スキップ(約37行のbashとpathspec維持)を行っていたが、実測は15秒程度
        # (CI全体でも約2分)であり、そもそも短縮の必要性が薄かった。この機構は
        # Issue #368で「pathspec の維持漏れによりDDDテストが黙ってスキップされる」
        # という失敗モードを既に一度起こしており、リスクがコストに見合わないため
        # 撤去し、常に実行する。
        #
        # `DDD/.coveragerc`(Issue #665)は「テストと conftest を除外してソースだけの
        # カバレッジを見る」ために作られていたが、CI から `--cov` が渡されておらず
        # 一度も計測されていなかった。MY_HOME_SYSTEM / family-quest の双方が床または
        # ラチェットで守られている一方、DDD だけがカバレッジのゲートを一切持たない
        # 状態だったため配線する。スイート自体は約20秒で終わり追加コストはほぼ無い。
        # 床 74 は実測(2026-09-21: 77%)の約3pt下。MY_HOME_SYSTEM と同じく
        # 「実測より約3pt下へ段階的に引き上げる」(Issue #494/#536)に倣う。
        working-directory: ./DDD
        run: |
          python -m pytest -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=74

      - name: Download master DDD coverage baseline
        # 比較元の run ID は上の `baseline_run` ステップ(同一ジョブ)の出力を再利用する。
        # 成果物の保持期限(14日)切れ等で取れなくても失敗にはしない(比較スキップ)。
        if: github.event_name == 'pull_request' && steps.baseline_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ddd-coverage-report
          run-id: ${{ steps.baseline_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: DDD/coverage-baseline

      - name: DDD coverage ratchet vs master (blocking, PR only)
        # backend / frontend と同じ 0.5pt ラチェット。固定閾値(床)は上の
        # `--cov-fail-under=74` が担い、こちらは master 比の退行だけを見る。
        if: github.event_name == 'pull_request'
        working-directory: ./DDD
        run: |
          baseline="$(find coverage-baseline -name coverage.xml -print -quit 2>/dev/null || true)"
          python3 ../.github/scripts/check_coverage_ratchet.py --label ddd \
            --current coverage.xml --baseline "${baseline:-coverage-baseline/missing.xml}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            MY_HOME_SYSTEM/coverage.xml
            MY_HOME_SYSTEM/htmlcov/
          retention-days: 14

      - name: Upload DDD coverage report
        # backend 側の成果物(coverage-report)に相乗りさせると、アップロード対象の
        # 共通祖先がリポジトリルートへ繰り上がって既存の
        # `find coverage-baseline -name coverage.xml` が2件に一致してしまうため、
        # frontend と同じく DDD 専用の成果物として分ける。
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ddd-coverage-report
          path: DDD/coverage.xml
          retention-days: 14

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20  # C-L1 (Issue #414)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bandit ラチェット(merge-base との比較)のため履歴が必要
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Issue #403: 実機 .venv とCIで同じ版を使うよう MY_HOME_SYSTEM/.python-version を参照する
          python-version-file: MY_HOME_SYSTEM/.python-version
          cache: pip
          cache-dependency-path: |
            MY_HOME_SYSTEM/requirements.txt
            MY_HOME_SYSTEM/requirements-dev.txt

      - name: Install dependencies
        # Issue #499: このジョブが実行するのはbandit(ASTベースの静的解析)と
        # pip-audit(-r指定でファイルを読むだけ)のみで、いずれもrequirements.txt
        # (117パッケージ)のインストール済み環境を必要としない。dev依存(bandit/
        # pip-audit本体)のみを入れる。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bandit (High severity - blocking)
        # 現状 High severity の指摘は0件。Medium/Low(主にf-string SQL構築の誤検知含む)は
        # 大量に残っているため、それらで一律ブロックはせず、次のステップで可視化のみ行う。
        run: bandit -r . -x ./tests -lll

      - name: Bandit (full report - non-blocking)
        run: bandit -r . -x ./tests -f txt -o bandit-report.txt || true
        continue-on-error: true

      - name: Bandit DDD (High severity - blocking)
        # H-11 当時は既存の High severity 指摘(SHA1使用等)が残っていたため非ブロッキングに
        # していたが、2026-09 時点で High は 0 件になったため MY_HOME_SYSTEM と同じ基準で
        # ブロッキング化する。
        working-directory: ./DDD
        run: bandit -r . -lll

      - name: Bandit DDD (full report - non-blocking)
        working-directory: ./DDD
        run: bandit -r . -f txt -o bandit-report-ddd.txt || true
        continue-on-error: true

      - name: Bandit ratchet - no new Medium+ findings vs merge-base (blocking, PR only)
        # Medium/Low の既存指摘(主に f-string SQL の B608、LOW confidence)は残っているため
        # 一律ブロックはしないが、merge-base 時点より増えた指摘はブロックする。
        # 対象は severity/confidence とも Medium 以上(-ll -ii)。B608 は confidence LOW
        # のため対象外で、このリポジトリで常用している f-string SQL は引っかからない。
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          python3 .github/scripts/check_lint_ratchet.py --tool bandit --dir MY_HOME_SYSTEM --base "$merge_base" -- -x ./tests -ll -ii
          python3 .github/scripts/check_lint_ratchet.py --tool bandit --dir DDD --base "$merge_base" -- -ll -ii

      - name: pip-audit (known CVEs - non-blocking)
        # Issue #324 (2026-09-02) で既知CVE付きの固定バージョンは一括更新済みで、
        # この時点の検知は0件。新規CVEの公開はPRの差分と無関係にCIを赤くし得る
        # ため、引き続きPR単位ではブロッキングにしない。代わりに
        # pip-audit-weekly-audit.yml が同じ対象を週次監査し、検知が出れば
        # Issueで可視化・追跡する(仕様書ドリフトのIssue #20と同型の運用)。
        # 注意(Issue #366): pip-audit は検知0件のとき -o の出力ファイルを生成しない
        # (stdoutに "No known vulnerabilities found" を出すのみ)。後続のアーティファクト
        # アップロードで pip-audit-report.md が見つからなくても正常(=検知なし)である。
        run: pip-audit -r requirements.txt --desc -f markdown -o pip-audit-report.md || true
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: |
            MY_HOME_SYSTEM/bandit-report.txt
            MY_HOME_SYSTEM/pip-audit-report.md
            DDD/bandit-report-ddd.txt
          retention-days: 14

  frontend:
    name: Frontend Build (family-quest)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # C-L1 (Issue #414)
    defaults:
      run:
        working-directory: ./family-quest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: family-quest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        # Issue #401: `npm run lint` はCLAUDE.mdに開発コマンドとして載っているのに
        # CIでは未実行だった。現状0エラーのため追加コストなしでゲート化する。
        run: npm run lint

      - name: Build (tsc -b && vite build)
        # H-11: 以前はfamily-quest側にCIが一切無く、H-8のようなフロントエンドの
        # フィルタ不具合やTSの型エラーがマージまで検出できなかった。
        # 最小限としてまずビルド検証(tsc型チェック含む)をブロッキング条件にする。
        run: npm run build

      - name: Test (vitest + coverage)
        # family-questにはテストが1件も無かった。まずgetQuestLockState
        # (ロック/完了/申請中判定の共通ロジック)・isSameOriginAvatarPath
        # (M-9-5のアバターURL検証)・useOnlineStatusの回帰テストで土台を作る。
        # Issue #495: バックエンドと異なりカバレッジ計測が無かったため追加する。
        # 閾値はまだ設定せず、まず可視化のみ行う。
        run: npm run test:coverage

      - name: Find latest successful master run (frontend coverage baseline)
        # backend と同一の処理(比較元の探し方はサブシステムに依らない)。
        # vitest 側は json-summary(coverage-summary.json)を比較に使う。
        if: github.event_name == 'pull_request'
        id: baseline_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ../.github/scripts/find_coverage_baseline.sh

      - name: Download master frontend coverage baseline
        if: github.event_name == 'pull_request' && steps.baseline_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage-report
          run-id: ${{ steps.baseline_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: family-quest/coverage-baseline

      - name: Frontend coverage ratchet vs master (blocking, PR only)
        # Issue #495 で「まず可視化」とした frontend にも閾値の代わりにラチェットを適用する
        # (固定閾値は引き続き設定しない。master 比 0.5pt 超の低下だけを失敗にする)。
        if: github.event_name == 'pull_request'
        run: |
          baseline="$(find coverage-baseline -name coverage-summary.json -print -quit 2>/dev/null || true)"
          python3 ../.github/scripts/check_coverage_ratchet.py --label frontend \
            --current coverage/coverage-summary.json --baseline "${baseline:-coverage-baseline/missing.json}"

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-report
          path: family-quest/coverage/
          retention-days: 14
