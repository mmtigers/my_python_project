name: Python Tests

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# M-10-1: 他2ワークフロー(spec-drift-*.yml)は最小権限を明示しているが、
# 本ワークフローには permissions ブロックが無く、リポジトリ設定次第で
# write-all トークンが供給される余地があった。読み取り専用に固定する。
permissions:
  contents: read

defaults:
  run:
    working-directory: ./MY_HOME_SYSTEM

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            MY_HOME_SYSTEM/requirements.txt
            MY_HOME_SYSTEM/requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (correctness gate - blocking)
        # 未定義名の参照・構文エラー等、明確なバグのみをブロッキング条件とする。
        # 既存コードには多数のスタイル上の指摘(未使用import等)が残っているが、
        # それらでPRを一律ブロックしないよう、次のステップでは警告のみに留める。
        run: ruff check . --select F821,F822,F823,E9 --output-format=github

      - name: Ruff (full report - non-blocking)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Ruff DDD (correctness gate - blocking)
        # H-11: MY_HOME_SYSTEM以外(DDD)は従来CI対象外だった。
        # 同じ「明確なバグのみブロッキング」方針をDDDにも適用する。
        working-directory: ./DDD
        run: ruff check . --select F821,F822,F823,E9 --output-format=github

      - name: Ruff DDD (full report - non-blocking)
        working-directory: ./DDD
        run: ruff check . --output-format=github
        continue-on-error: true

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # pull_request時のDDD変更検知(下のCheck for DDD changesステップ)で、
          # マージコミットの親(HEAD^1=ベースブランチ)との差分を取るために必要。
          fetch-depth: 2

      - name: Check for DDD changes
        # DDDテストは全体の約3分半(重い回帰テスト2件+yt_dlp等のimport)を占めるが、
        # DDDは他サブシステムからほぼ独立しているため、PRの差分に関連ファイルが
        # 含まれない場合はスキップして良い。push/workflow_dispatch時、および差分を
        # 判定できない異常時は、安全側に倒して常に実行する。
        #
        # Issue #368: DDD/newface_monitor.py・extract_youtube_urls.py は sys.path に
        # MY_HOME_SYSTEM を足して core.logger / core.nas_utils / core.utils / config を
        # 直接importするため、DDD/ だけでなくそれらのimport先も pathspec に含める
        # (以前は core/ や config.py の変更PRでDDDテストが黙ってスキップされていた)。
        # また git diff 自体の失敗が "changed=false" に倒れないよう pipefail を付ける。
        id: ddd_changes
        working-directory: .
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify 'HEAD^1' >/dev/null; then
            echo "::warning::マージコミットの親を取得できないため、安全側に倒してDDDテストを実行します"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ddd_pathspec="DDD/ MY_HOME_SYSTEM/core/ MY_HOME_SYSTEM/config.py MY_HOME_SYSTEM/common.py"
          # shellcheck disable=SC2086  # pathspecは意図的に単語分割する
          if ! changed_files=$(git diff --name-only HEAD^1 HEAD -- $ddd_pathspec); then
            echo "::warning::git diff に失敗したため、安全側に倒してDDDテストを実行します"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$changed_files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "DDD/** またはDDDのimport先(${ddd_pathspec}) に変更あり: DDDテストを実行します"
            echo "$changed_files"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "DDD/** およびDDDのimport先に変更なし: DDDテストをスキップします"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            MY_HOME_SYSTEM/requirements.txt
            MY_HOME_SYSTEM/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # Issue #367: .coveragerc の omit を「本当に実行不能なもの」だけに絞った
        # 真のビュー(2026-09-04時点の実測 67%: 6,575 stmts / miss 2,151)を基準に、
        # 約3pt下の 64 を閾値とする(旧 45 は omit で水増しされた公式ビュー 87% に
        # 対する値で、退行検知として機能していなかった)。段階的に引き上げること。
        env:
          # CI環境用の環境変数。SQLITE_DB_PATHはconfig.py側で読み込まれるよう修正済み。
          SQLITE_DB_PATH: ":memory:"
          NAS_MOUNT_POINT: "./tmp_nas"
          NOTIFICATION_TARGET: "none"
        run: |
          python -m pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=64

      - name: Install DDD dependencies
        # lint/bandit(H-11)はDDDにも対象拡大済みだが、pytestだけCIから未実行だった。
        # DDD/conftest.py(#103/#137)がDiscord/LINE Webhook系の環境変数をマスクする
        # ため、logger.error/critical経由で本番Webhookへ誤通知する心配はない。
        if: steps.ddd_changes.outputs.changed == 'true'
        working-directory: ./DDD
        run: pip install -r requirements.txt

      - name: Run DDD tests
        if: steps.ddd_changes.outputs.changed == 'true'
        working-directory: ./DDD
        run: python -m pytest -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            MY_HOME_SYSTEM/coverage.xml
            MY_HOME_SYSTEM/htmlcov/
          retention-days: 14

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            MY_HOME_SYSTEM/requirements.txt
            MY_HOME_SYSTEM/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Bandit (High severity - blocking)
        # 現状 High severity の指摘は0件。Medium/Low(主にf-string SQL構築の誤検知含む)は
        # 大量に残っているため、それらで一律ブロックはせず、次のステップで可視化のみ行う。
        run: bandit -r . -x ./tests -lll

      - name: Bandit (full report - non-blocking)
        run: bandit -r . -x ./tests -f txt -o bandit-report.txt || true
        continue-on-error: true

      - name: Bandit DDD (full report - non-blocking)
        # H-11: DDDは従来CI対象外だった。MY_HOME_SYSTEMと異なり既存のHigh
        # severity指摘(SHA1使用等)が残っているため、いきなりブロッキングには
        # せず、まず可視化を優先する(MY_HOME_SYSTEM側のBandit Medium/Lowの
        # 扱いと同様の方針)。
        working-directory: ./DDD
        run: bandit -r . -f txt -o bandit-report-ddd.txt || true
        continue-on-error: true

      - name: pip-audit (known CVEs - non-blocking)
        # Issue #324 (2026-09-02) で既知CVE付きの固定バージョンは一括更新済みで、
        # この時点の検知は0件。新規CVEの公開はPRの差分と無関係にCIを赤くし得る
        # ため、引き続きPR単位ではブロッキングにしない。代わりに
        # pip-audit-weekly-audit.yml が同じ対象を週次監査し、検知が出れば
        # Issueで可視化・追跡する(仕様書ドリフトのIssue #20と同型の運用)。
        # 注意(Issue #366): pip-audit は検知0件のとき -o の出力ファイルを生成しない
        # (stdoutに "No known vulnerabilities found" を出すのみ)。後続のアーティファクト
        # アップロードで pip-audit-report.md が見つからなくても正常(=検知なし)である。
        run: pip-audit -r requirements.txt --desc -f markdown -o pip-audit-report.md || true
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: |
            MY_HOME_SYSTEM/bandit-report.txt
            MY_HOME_SYSTEM/pip-audit-report.md
            DDD/bandit-report-ddd.txt
          retention-days: 14

  frontend:
    name: Frontend Build (family-quest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./family-quest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: family-quest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        # H-11: 以前はfamily-quest側にCIが一切無く、H-8のようなフロントエンドの
        # フィルタ不具合やTSの型エラーがマージまで検出できなかった。
        # 最小限としてまずビルド検証(tsc型チェック含む)をブロッキング条件にする。
        run: npm run build

      - name: Test (vitest)
        # family-questにはテストが1件も無かった。まずgetQuestLockState
        # (ロック/完了/申請中判定の共通ロジック)・isSameOriginAvatarPath
        # (M-9-5のアバターURL検証)・useOnlineStatusの回帰テストで土台を作る。
        run: npm test
