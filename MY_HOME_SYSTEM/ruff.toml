# MY_HOME_SYSTEM/ruff.toml
#
# Intentionally lenient: this only enables a small, high-signal set of
# Pyflakes checks that catch genuine runtime bugs (undefined names, invalid
# syntax-level constructs). It deliberately does NOT enable style/formatting
# rules (line length, import sorting, unused imports, etc.) so CI doesn't go
# red on the large amount of pre-existing, non-breaking style variance in
# this codebase. Broaden this over time as the codebase is cleaned up.
target-version = "py311"

[lint]
select = [
    "F821", # undefined-name
    "F822", # undefined-export
    "F823", # undefined-local (referenced before assignment)
    "F631", # assert-on-string-literal (always-true tuple assert)
    "F632", # is-literal (== should be used instead of is/is not for literals)
    "F701", # break-outside-loop
    "F702", # continue-outside-loop
    "F706", # return-outside-function
    "F707", # default-except-not-last
]
