[pytest]
asyncio_mode = auto
testpaths = tests
# Issue #491: 未登録マーカーのタイポ検知(--strict-markers)と、自リポジトリの
# services/*配下から出るFutureWarning/DeprecationWarningの可視化を追加する。
# サードパーティ由来の警告まで一律errorにするとCIが赤くなりやすいため
# (Issue #482のDependabot赤CI常態化と同じ轍を踏まないため)、対象を
# services.* に限定する。実際にservices/analysis_service.py:234のpandas
# FutureWarningが検知されたため、これは既に修正済み。
# Issue #837: -rfE で失敗・エラーになったテストの名前を末尾の要約に必ず出す。
# 全件実行で1件だけ稀に落ちたとき、-q だと件数しか残らず名前を特定できなかったため。
addopts = --strict-markers -rfE
filterwarnings =
    default
    error::FutureWarning:services.*
    error::DeprecationWarning:services.*
